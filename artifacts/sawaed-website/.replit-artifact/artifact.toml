kind = "web"
previewPath = "/"
title = "Sawaed Al-Nafah"
version = "1.0.0"
id = "artifacts/sawaed-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19467

[services.development]
run = "pnpm --filter @workspace/sawaed-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sawaed-website", "run", "build" ]
publicDir = "artifacts/sawaed-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19467"
BASE_PATH = "/"
